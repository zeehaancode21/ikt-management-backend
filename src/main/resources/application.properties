server.port=8080

# === Database — set these via environment variables ===
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN

# Hikari pool
spring.datasource.hikari.pool-name=HikariPool-App
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
# Railway's TCP proxy silently drops idle connections well under 5 minutes,
# so connections must be recycled (and pinged) faster than that or Hikari
# hands out a connection the server has already closed -> "No operations
# allowed after connection closed".
spring.datasource.hikari.max-lifetime=270000
spring.datasource.hikari.keepalive-time=90000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=200000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=60000

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# Multipart file upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
file.upload-dir=./uploads

spring.output.ansi.enabled=ALWAYS

# === JWT — set JWT_SECRET env variable ===
# Generate a strong secret: openssl rand -base64 64
jwt.secret=${JWT_SECRET}

# === Firebase — set via environment variables ===
firebase.enabled=true
firebase.project-id=${FIREBASE_PROJECT_ID}
firebase.private-key-id=${FIREBASE_PRIVATE_KEY_ID}
firebase.private-key=${FIREBASE_PRIVATE_KEY}
firebase.client-email=${FIREBASE_CLIENT_EMAIL}
firebase.client-id=${FIREBASE_CLIENT_ID}
firebase.database-url=${FIREBASE_DATABASE_URL}

# === KYC Encryption — set via environment variable ===
# Generate: openssl rand -base64 32
kyc.encryption.key=${KYC_ENCRYPTION_KEY}

app.retention.messages-days=20
app.retention.group-messages-days=20
app.retention.notifications-days=20

# Cron schedule for the cleanup job. Default: daily at 03:00 server time.
# Format: sec min hour day month weekday
app.retention.cron=0 0 3 * * *

# === Mistral AI ===
mistral.api.key=${MISTRAL_API_KEY:}
mistral.api.url=https://api.mistral.ai/v1/chat/completions

