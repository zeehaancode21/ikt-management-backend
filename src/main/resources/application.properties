# Render injects PORT; falls back to 8080 locally
server.port=${PORT:8080}

# Fewer Tomcat threads = less memory on a 512 MB instance
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
# Smaller JSON payloads over the wire (attachments/images are not compressed)
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript,image/svg+xml

spring.main.banner-mode=off
spring.jmx.enabled=false

# === Database — set these via environment variables ===
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# "update" scans every table at startup (slow cold start). Once your schema is
# stable, set JPA_DDL_AUTO=none in Render.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

logging.level.org.springframework.web=WARN

# Hikari pool — small on purpose (free tier). No keepalive pings and no
# connection-test-query: Hikari validates a connection with isValid() only
# when it is handed out after sitting idle, so nothing runs in the background.
spring.datasource.hikari.pool-name=HikariPool-App
spring.datasource.hikari.minimum-idle=1
# 4 is plenty for this app. Every open connection holds server-side buffers in MySQL
# (a connection that carried a 20 MB file keeps a 20 MB packet buffer until it is recycled).
spring.datasource.hikari.maximum-pool-size=4
# Railway's TCP proxy drops idle connections in under 5 minutes, so connections
# are recycled before that.
spring.datasource.hikari.max-lifetime=270000
spring.datasource.hikari.idle-timeout=200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000

# --- Faster / lighter DB access (no behaviour change) ---
# Re-use prepared statements on the client side instead of re-parsing every query.
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=50
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=512
# Keep Hibernate's query-plan caches small (saves heap on a 512 MB instance).
spring.jpa.properties.hibernate.query.plan_cache_max_size=64
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=32
# Fewer distinct SQL shapes for IN (...) lists -> better plan/statement cache hits.
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
# When lazy collections are loaded, load them in batches instead of one query each.
spring.jpa.properties.hibernate.default_batch_fetch_size=16
# Cap open sockets so idle browser/websocket connections can't pile up memory.
server.tomcat.max-connections=300

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# Multipart file upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
file.upload-dir=./uploads

spring.output.ansi.enabled=NEVER

# === JWT — set JWT_SECRET env variable ===
# Generate a strong secret: openssl rand -base64 64
jwt.secret=${JWT_SECRET}

# === Firebase — set via environment variables ===
firebase.enabled=true
firebase.project-id=${FIREBASE_PROJECT_ID}
firebase.private-key-id=${FIREBASE_PRIVATE_KEY_ID}
firebase.private-key=${FIREBASE_PRIVATE_KEY}
firebase.client-email=${FIREBASE_CLIENT_EMAIL}
firebase.client-id=${FIREBASE_CLIENT_ID}
firebase.database-url=${FIREBASE_DATABASE_URL}

# === KYC Encryption — set via environment variable ===
# Generate: openssl rand -base64 32
kyc.encryption.key=${KYC_ENCRYPTION_KEY}

app.retention.messages-days=20
app.retention.group-messages-days=20
app.retention.notifications-days=20

# Cron schedule for the cleanup job. Default: daily at 03:00 server time.
# Format: sec min hour day month weekday
app.retention.cron=0 0 3 * * *

# === Mistral AI ===
mistral.api.key=${MISTRAL_API_KEY:}
mistral.api.url=https://api.mistral.ai/v1/chat/completions

# === Pollinations (images). Key is optional; set POLLINATIONS_API_KEY in Render ===
pollinations.api.url=https://image.pollinations.ai/prompt
pollinations.api.key=${POLLINATIONS_API_KEY:}

ai.image.model=flux
ai.image.edit-model=kontext
ai.image.width=1024
ai.image.height=1024
# Number of image options generated per "Generate images" click (1-10)
ai.image.count=1
# Max time to wait for the provider to return before failing the request
ai.image.timeout-ms=60000

# Public base URL for reference image fetching (ReferenceImageCacheService /
# the /reference-source endpoint)
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}

# === LinkedIn API ===
linkedin.access.token=${LINKEDIN_ACCESS_TOKEN}
linkedin.person.urn=${LINKEDIN_PERSON_URN:}
linkedin.api.url=https://api.linkedin.com/v2/ugcPosts

# Scheduled-post poller: how often the DB is checked for due posts (ms).
# 300000 = 5 min, so a scheduled post can fire up to 5 min late.
# Lower it (e.g. 60000) if you need tighter timing.
app.scheduledpost.poll-interval-ms=300000

# RFI email replies: the app already checks automatically while someone is using it
# (nothing to configure). Set this to true ONLY if you also want checks while nobody has
# the app open (e.g. phone push for a reply that arrives overnight). Off = zero extra
# background work. Interval in ms (default 10 min).
app.rfi.autocheck.enabled=${APP_RFI_AUTOCHECK_ENABLED:false}
app.rfi.autocheck.interval-ms=600000